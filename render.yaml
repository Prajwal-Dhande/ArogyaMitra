services:
  # 1. Node.js Backend Service
  - type: web
    name: arogyamitra-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      # You need to manually add MONGODB_URI in Render dashboard later
      # You need to manually add AI_SERVICE_URL in Render dashboard later

  # 2. Python AI Service
  - type: web
    name: arogyamitra-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      # You need to manually add GROQ_API_KEY in Render dashboard later
